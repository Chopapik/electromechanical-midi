[platformio]
default_envs = uno

[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
build_src_filter = +<main.cpp>

[env:esp32]
platform = espressif32@7.1.3
board = esp32dev
framework = arduino
monitor_speed = 115200
; Monitoring must not drive the USB-UART auto-reset control lines.
monitor_dtr = 0
monitor_rts = 0
build_src_filter = +<esp32/main.cpp>
lib_deps = h2zero/NimBLE-Arduino@1.4.3
build_flags =
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -DCONFIG_BT_NIMBLE_PINNED_TO_CORE=0
